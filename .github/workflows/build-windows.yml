name: Build Windows plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  build-windows:
    name: Build mikhlink.dll
    runs-on: windows-2022

    steps:
      - name: Mark build pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'Mikhlink Windows build',
              description: 'Windows plugin and patched SRTLA sender are building',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Check out Mikhlink
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows-x64

      - name: Build
        run: cmake --build --preset windows-x64 --parallel

      - name: Check out SRTLA sender
        uses: actions/checkout@v4
        with:
          repository: irlserver/srtla_send
          ref: e65e0fe49ea078e3e480b346355b86589fbe37a5
          path: external/srtla_send

      - name: Apply Mikhlink uplink weighting
        shell: pwsh
        run: |
          git -C external/srtla_send apply "$env:GITHUB_WORKSPACE/patches/srtla_send-weighted-uplinks.patch"

      - name: Build SRTLA sender
        shell: pwsh
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add --toolchain nightly rustfmt clippy
          Push-Location external/srtla_send
          cargo +nightly fmt --all -- --check
          cargo +nightly clippy --workspace --all-targets --locked -- -D warnings
          Pop-Location
          cargo +nightly test --workspace --locked --manifest-path external/srtla_send/Cargo.toml
          cargo +nightly build --release --locked --manifest-path external/srtla_send/Cargo.toml

      - name: Collect plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item build_x64/src/RelWithDebInfo/mikhlink.dll artifact/
          Copy-Item external/srtla_send/target/release/srtla_send.exe artifact/
          Copy-Item external/srtla_send/LICENSE artifact/srtla_send-LICENSE
          if (Test-Path build_x64/src/RelWithDebInfo/mikhlink.pdb) {
            Copy-Item build_x64/src/RelWithDebInfo/mikhlink.pdb artifact/
          }

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: mikhlink-windows-x64
          path: artifact/
          if-no-files-found: error

      - name: Report build result
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const succeeded = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: succeeded ? 'success' : 'failure',
              context: 'Mikhlink Windows build',
              description: succeeded
                ? 'Windows plugin, Rust checks, tests, and artifact passed'
                : 'Windows plugin or patched SRTLA sender build failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
